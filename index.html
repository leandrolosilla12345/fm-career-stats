<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FM Career Stats</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background-color:#0b1220;
    color:white;
}

.container{
    display:flex;
    min-height:100vh;
}

.sidebar{
    width:260px;
    background-color:#111827;
    padding:30px;
}

.logo{
    font-size:28px;
    font-weight:bold;
    margin-bottom:40px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.menu button{
    background:#1f2937;
    border:none;
    color:white;
    padding:15px;
    border-radius:10px;
    cursor:pointer;
}

.menu button:hover{
    background:#374151;
}

.content{
    flex:1;
    padding:40px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.new-save{
    background:#7c3aed;
    border:none;
    color:white;
    padding:15px 20px;
    border-radius:10px;
    cursor:pointer;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#111827;
    padding:25px;
    border-radius:15px;
}

.card h3{
    margin-bottom:10px;
}

.card p{
    color:#cbd5e1;
}

@media(max-width:768px){

.container{
    flex-direction:column;
}

.sidebar{
    width:100%;
}

}
</style>
</head>

<body>

<div class="container">

    <div class="sidebar">

        <div class="logo">
            ⚽ FM Career Stats
        </div>

        <div class="menu">
            <button>🏠 Início</button>
            <button>👥 Jogadores</button>
            <button>📅 Temporadas</button>
            <button>🏆 Títulos</button>
            <button>📊 Estatísticas</button>
            <button>⚙ Configurações</button>
        </div>

    </div>

    <div class="content">

        <div class="header">

            <h1>Meus saves</h1>

            <button class="new-save">
                + Criar novo save
            </button>

        </div>

        <div class="cards">

            <div class="card">
                <h3>Borussia Dortmund</h3>
                <p>Temporada: 2026/27</p>
            </div>

            <div class="card">
                <h3>São Paulo</h3>
                <p>Temporada: 2027</p>
            </div>

            <div class="card">
                <h3>Manchester United</h3>
                <p>Temporada: 2028/29</p>
            </div>

        </div>

    </div>

</div>

</body>
</html>
