<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FM Career Stats</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #0b1220;
    color: white;
}

.container {
    display: flex;
    min-height: 100vh;
}

.sidebar {
    width: 240px;
    background: #111827;
    padding: 30px 20px;
    flex-shrink: 0;
}

.logo {
    font-size: 27px;
    font-weight: bold;
    margin-bottom: 40px;
    line-height: 1.2;
}

.menu {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.menu button {
    width: 100%;
    background: #1f2937;
    border: none;
    color: white;
    padding: 15px;
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
}

.menu button:hover {
    background: #374151;
}

.content {
    flex: 1;
    padding: 40px;
    min-width: 0;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
}

.header h1 {
    font-size: 32px;
}

.new-save {
    background: #7c3aed;
    border: none;
    color: white;
    padding: 14px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

.new-save:hover {
    background: #6d28d9;
}

.form-area {
    display: none;
    margin-bottom: 30px;
}

.form-card {
    max-width: 700px;
    background: #111827;
    padding: 25px;
    border-radius: 15px;
}

.form-card h2 {
    margin-bottom: 20px;
}

.form-card input,
.form-card select {
    width: 100%;
    padding: 13px;
    margin-bottom: 14px;
    border: 1px solid #374151;
    border-radius: 9px;
    background: #0f172a;
    color: white;
    outline: none;
}

.form-card input:focus,
.form-card select:focus {
    border-color: #7c3aed;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 20px;
}

.card {
    background: #111827;
    padding: 25px;
    border-radius: 15px;
    min-height: 120px;
}

.card h3 {
    margin-bottom: 10px;
}

.card p {
    color: #cbd5e1;
}

@media (max-width: 768px) {
    .container {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
    }

    .content {
        padding: 25px;
    }

    .header {
        align-items: flex-start;
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <aside class="sidebar">

        <div class="logo">
            ⚽ FM Career Stats
        </div>

        <div class="menu">
            <button>🏠 Início</button>
            <button>👥 Jogadores</button>
            <button>📅 Temporadas</button>
            <button>🏆 Títulos</button>
            <button>📊 Estatísticas</button>
            <button>⚙ Configurações</button>
        </div>

    </aside>

    <main class="content">

        <div class="header">
            <h1>Meus saves</h1>

            <button class="new-save" onclick="mostrarFormulario()">
                + Criar novo save
            </button>
        </div>

        <div id="novoSave" class="form-area">

            <div class="form-card">

                <h2>Criar novo save</h2>

                <input
                    id="nomeSave"
                    type="text"
                    placeholder="Nome do save"
                >

                <input
                    id="nomeClube"
                    type="text"
                    placeholder="Nome do clube"
                >

                <input
                    id="treinador"
                    type="text"
                    placeholder="Nome do treinador"
                >

                <input
                    id="temporada"
                    type="text"
                    placeholder="Temporada inicial, exemplo: 2026/27"
                >

                <button class="new-save" onclick="salvarSave()">
                    Salvar save
                </button>

            </div>

        </div>

        
            </div>

        </div>

    </main>

</div>

<script>
function mostrarFormulario() {
    const formulario = document.getElementById("novoSave");

    if (formulario.style.display === "block") {
        formulario.style.display = "none";
    } else {
        formulario.style.display = "block";
    }
}

function salvarSave() {
    const nomeSave = document.getElementById("nomeSave").value.trim();
    const nomeClube = document.getElementById("nomeClube").value.trim();
    const temporada = document.getElementById("temporada").value.trim();

    if (!nomeSave || !nomeClube || !temporada) {
        alert("Preencha o nome do save, o clube e a temporada.");
        return;
    }

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
        <h3>${nomeClube}</h3>
        <p>Save: ${nomeSave}</p>
        <p>Temporada: ${temporada}</p>
    `;

    document.getElementById("listaSaves").appendChild(card);

    document.getElementById("nomeSave").value = "";
    document.getElementById("nomeClube").value = "";
    document.getElementById("treinador").value = "";
    document.getElementById("temporada").value = "";

    document.getElementById("novoSave").style.display = "none";      
}
</script>

</body>
</html>
<script>
const CHAVE_SAVES = "fmCareerStatsSaves";

function mostrarFormulario() {
    const formulario = document.getElementById("novoSave");
    const estaAberto = formulario.style.display === "block";

    formulario.style.display = estaAberto ? "none" : "block";
}

function obterSaves() {
    try {
        const dadosSalvos = localStorage.getItem(CHAVE_SAVES);
        return dadosSalvos ? JSON.parse(dadosSalvos) : [];
    } catch (erro) {
        console.error("Erro ao carregar os saves:", erro);
        return [];
    }
}

function guardarSaves(saves) {
    localStorage.setItem(CHAVE_SAVES, JSON.stringify(saves));
}

function salvarSave() {
    const tipoSave = document.getElementById("tipoSave").value;
    const nomeSave = document.getElementById("nomeSave").value.trim();
    const nomeClube = document.getElementById("nomeClube").value.trim();
    const treinador = document.getElementById("treinador").value.trim();
    const temporada = document.getElementById("temporada").value.trim();

    if (!tipoSave || !nomeSave || !nomeClube || !temporada) {
        alert(
            "Preencha o tipo de save, o nome do save, o clube ou seleção e a temporada."
        );
        return;
    }

    const novoSave = {
        id: Date.now(),
        tipo: tipoSave,
        nomeSave: nomeSave,
        clube: nomeClube,
        treinador: treinador,
        temporada: temporada
    };

    const saves = obterSaves();
    saves.push(novoSave);
    guardarSaves(saves);

    limparFormulario();
    carregarSaves();

    document.getElementById("novoSave").style.display = "none";
}

function limparFormulario() {
    document.getElementById("tipoSave").value = "";
    document.getElementById("nomeSave").value = "";
    document.getElementById("nomeClube").value = "";
    document.getElementById("treinador").value = "";
    document.getElementById("temporada").value = "";
}

function criarCard(save) {
    const card = document.createElement("div");
    card.className = "card";

    const titulo = document.createElement("h3");
    titulo.textContent = save.clube;

    const tipo = document.createElement("p");
    tipo.textContent = `Tipo: ${save.tipo}`;

    const nome = document.createElement("p");
    nome.textContent = `Save: ${save.nomeSave}`;

    const temporada = document.createElement("p");
    temporada.textContent = `Temporada: ${save.temporada}`;

    card.appendChild(titulo);
    card.appendChild(tipo);
    card.appendChild(nome);
    card.appendChild(temporada);

    if (save.treinador) {
        const treinador = document.createElement("p");
        treinador.textContent = `Treinador: ${save.treinador}`;
        card.appendChild(treinador);
    }

    const botaoExcluir = document.createElement("button");
    botaoExcluir.textContent = "Excluir save";
    botaoExcluir.style.marginTop = "18px";
    botaoExcluir.style.padding = "9px 12px";
    botaoExcluir.style.border = "none";
    botaoExcluir.style.borderRadius = "8px";
    botaoExcluir.style.background = "#dc2626";
    botaoExcluir.style.color = "white";
    botaoExcluir.style.cursor = "pointer";

    botaoExcluir.addEventListener("click", function () {
        excluirSave(save.id);
    });

    card.appendChild(botaoExcluir);

    return card;
}

function carregarSaves() {
    const lista = document.getElementById("listaSaves");
    const saves = obterSaves();

    lista.innerHTML = "";

    if (saves.length === 0) {
        const mensagem = document.createElement("div");
        mensagem.className = "card";

        const titulo = document.createElement("h3");
        titulo.textContent = "Nenhum save criado";

        const texto = document.createElement("p");
        texto.textContent =
            "Clique em “Criar novo save” para começar sua carreira.";

        mensagem.appendChild(titulo);
        mensagem.appendChild(texto);
        lista.appendChild(mensagem);

        return;
    }

    saves.forEach(function (save) {
        lista.appendChild(criarCard(save));
    });
}

function excluirSave(id) {
    const confirmar = window.confirm(
        "Tem certeza de que deseja excluir este save?"
    );

    if (!confirmar) {
        return;
    }

    const saves = obterSaves();
    const savesAtualizados = saves.filter(function (save) {
        return save.id !== id;
    });

    guardarSaves(savesAtualizados);
    carregarSaves();
}

document.addEventListener("DOMContentLoaded", carregarSaves);
</script>

    <option value="Seleção nacional">Seleção nacional</option>
</select>

    id="nomeSave"
